<head>
  <link rel="shortcut icon" type="image/x-icon" href="/images/favicon.ico" />
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var s = localStorage.getItem('site-style');
        if (s === 'classic') document.documentElement.setAttribute('data-style', 'classic');
        else document.documentElement.setAttribute('data-style', 'qex');
        if (localStorage.getItem('qex-theme') === 'dark') {
          document.documentElement.setAttribute('data-qex-theme', 'dark');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-style', 'qex');
      }
    })();
  </script>
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/qex.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  <script defer src="{{ "/assets/js/site-style.js" | relative_url }}"></script>
</head>
